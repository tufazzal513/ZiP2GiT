name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Temporary diagnostics: when the build fails, re-run it once and publish
      # the compiler output into the repository so the error text can be read
      # through the raw content endpoint. Guarded so it cannot loop forever.
      - name: Publish build log to repo
        if: steps.build.outcome == 'failure' && !contains(github.event.head_commit.message, '[ci-log]')
        run: |
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tail -c 100000 > ci-build-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-build-log.txt
          git commit -m "ci(log): capture build failure [ci-log]" || true
          git push || true

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1